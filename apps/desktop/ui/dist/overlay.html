<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin:0; height:100%; background:transparent; overflow:hidden; }
    canvas { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script type="module">
    const T = window.__TAURI__;
    const listen = T.event.listen;
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;

    function resize() {
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    addEventListener('resize', resize);

    let raf = 0;
    function draw(plan) {
      cancelAnimationFrame(raf);
      let t = 0;
      const stroke = () => {
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        ctx.lineWidth = 3;
        ctx.strokeStyle = getComputedStyle(document.body).getPropertyValue('--ink') || '#ffd166';
        ctx.font = '600 13px -apple-system, system-ui, sans-serif';
        for (const item of plan.items) {
          for (const s of item.strokes) {
            if (s.points.length < 2) continue;
            ctx.beginPath();
            ctx.moveTo(s.points[0].x, s.points[0].y);
            for (const p of s.points.slice(1)) ctx.lineTo(p.x, p.y);
            ctx.stroke();
          }
          if (item.label && item.target) {
            ctx.fillStyle = '#ffd166';
            ctx.fillText(item.label, item.target.x + 10, item.target.y - 10);
          }
        }
        t += 1;
        if (t < 20) raf = requestAnimationFrame(stroke);
      };
      stroke();
    }

    await listen('pointer-plan', (e) => draw(e.payload));
    await listen('pointer-clear', () => ctx.clearRect(0, 0, innerWidth, innerHeight));
  </script>
</body>
</html>
