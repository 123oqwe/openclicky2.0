name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs-and-invariants
    runs-on: ubuntu-latest
    # `issues` and `pull-requests` are here for the close guard only: it reads
    # one body and the comment count of the issues that body would close.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # This rides the required check on purpose. A separate job could be green
      # or missing while the merge gate stayed satisfied, which is the failure
      # mode this rule exists to stop. Only a pull request has a body to read.
      # The guard has to prove it can match before it is trusted with a body: the
      # first version knew three of GitHub's nine keyword forms.
      - name: The close guard still matches every keyword GitHub accepts
        run: bash scripts/check-close-evidence.sh --self-test
      - name: Closing an issue needs evidence in the issue
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-close-evidence.sh "${{ github.event.pull_request.number }}"
      - name: Structural invariants
        run: bash scripts/check-invariants.sh
      - name: Numbered-item coverage (88/88)
        run: python3 scripts/criteria-coverage.py
      - name: Substance check
        run: python3 scripts/doc-audit.py
      - name: Cross-references (section, ADR id, path)
        run: python3 scripts/ref-check.py
      - name: TDS matrix is generated and current
        run: |
          python3 scripts/tds-evidence.py
          git diff --exit-code -- docs/04-test-design.md

  prepare:
    name: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The workspace must be in the tree
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "::error::no Cargo workspace on this ref. The code lives on main, so a ref without it is a broken checkout, not a docs-only ref."
            exit 1
          fi
          echo "workspace present: running code checks"

  rust:
    name: rust-${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # check-new-tests.py compares against docs/.surface-baseline, which a
          # depth-1 clone cannot resolve. This repo is small.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/linux-deps.sh
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: invariants
        env:
          RUN_INVARIANT_MUTATIONS: "1"
        # bash, not the default shell: the guard below is bash syntax and the
        # default on Windows is PowerShell.
        shell: bash
        run: |
          # If the env line above disappears, both jobs would print "skipped"
          # and the most expensive check would vanish quietly.
          test "${RUN_INVARIANT_MUTATIONS}" = "1" || {
            echo "::error::the mutation check must run in this job"
            exit 1
          }
          bash scripts/check-invariants.sh
