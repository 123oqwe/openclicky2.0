name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs-and-invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the implementation branch (tests live there)
        run: git fetch --no-tags origin feat/impl:refs/remotes/origin/feat/impl || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structural invariants
        run: bash scripts/check-invariants.sh
      - name: Numbered-item coverage (88/88)
        run: python3 scripts/criteria-coverage.py
      - name: Substance check
        run: python3 scripts/doc-audit.py
      - name: Cross-references (section, ADR id, path)
        run: python3 scripts/ref-check.py
      - name: TDS matrix is generated and current
        run: |
          python3 scripts/tds-evidence.py
          git diff --exit-code -- docs/04-test-design.md

  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      has_code: ${{ steps.check.outputs.has_code }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f Cargo.toml ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            echo "workspace present: running code checks"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no Cargo workspace on this ref yet (code lives on the implementation branch); code checks are skipped, not passed"
          fi

  rust:
    name: rust-${{ matrix.os }}
    needs: prepare
    if: needs.prepare.outputs.has_code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/linux-deps.sh
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: invariants
        run: bash scripts/check-invariants.sh
