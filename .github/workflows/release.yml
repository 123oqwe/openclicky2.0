name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_tag:
        description: "Publish this existing tag with the workflow from this ref (e.g. v2.0.0)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: openclicky-macos
          - os: windows-latest
            artifact: openclicky-windows
          - os: ubuntu-latest
            artifact: openclicky-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/linux-deps.sh
      - name: Build
        run: cargo build --release -p openclicky-cli
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          # The three CLI builds all produce "openclicky", and the publish job
          # flattens the artifacts, so the name has to carry the platform.
          suffix=$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp target/release/openclicky.exe "dist/openclicky-${suffix}.exe"
          else
            cp target/release/openclicky "dist/openclicky-${suffix}"
          fi
          # Provenance per platform: a flat download would otherwise have three
          # files called COMMIT that overwrite each other.
          {
            git rev-parse HEAD
            git describe --tags --always
          } > "dist/COMMIT-${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  desktop:
    name: desktop-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
            artifact: openclicky-desktop-macos
          - os: windows-latest
            bundles: nsis
            artifact: openclicky-desktop-windows
          - os: ubuntu-latest
            bundles: appimage,deb
            artifact: openclicky-desktop-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/linux-deps.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install tauri CLI
        run: npm install -g @tauri-apps/cli@^2
      - name: Bundle
        working-directory: apps/desktop
        env:
          # Ad-hoc sign the bundle. Without this the Mach-O carries a signature
          # that says "there are sealed resources" while no _CodeSignature is
          # written, and codesign --verify reports "code has no resources but
          # signature indicates they must be present" on every download.
          APPLE_SIGNING_IDENTITY: "-"
        run: tauri build --bundles ${{ matrix.bundles }}
      - name: The macOS bundle must be self-consistent
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="target/release/bundle/macos/OpenClicky.app"
          test -d "$app/Contents/_CodeSignature" || {
            echo "::error::no _CodeSignature in the bundle; the seal was never written"
            exit 1
          }
          codesign --verify --verbose=2 "$app" || {
            echo "::error::codesign rejects the bundle"
            exit 1
          }
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" \
            "$app/Contents/Info.plist" >/dev/null || {
            echo "::error::Info.plist has no NSMicrophoneUsageDescription; macOS kills the process on the first microphone request"
            exit 1
          }
          # The usage string makes macOS willing to ask. The entitlement is what
          # it grants when the user says yes. Without it the request is refused
          # before any dialog appears, so the app can never be given the mic.
          codesign -d --entitlements :- "$app" 2>/dev/null \
            | grep -q "com.apple.security.device.audio-input" || {
            echo "::error::the bundle signs without audio-input, so macOS will refuse to prompt for the microphone"
            exit 1
          }
          echo "bundle seal, microphone usage string and audio-input entitlement are all present"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          copied=0
          for pat in dmg exe msi AppImage deb; do
            while IFS= read -r f; do
              cp "$f" dist/ && copied=$((copied+1))
            done < <(find target/release/bundle -type f -name "*.$pat")
          done
          if [ -d "target/release/bundle/macos/OpenClicky.app" ]; then
            (cd target/release/bundle/macos && zip -qr "$GITHUB_WORKSPACE/dist/OpenClicky.app.zip" OpenClicky.app)
          fi
          {
            git rev-parse HEAD
            git describe --tags --always
          } > "dist/COMMIT-${{ matrix.artifact }}"
          ls -la dist
          if [ "$copied" -eq 0 ]; then
            echo "::error::no installer was produced for ${{ matrix.os }}; a green job with an empty artifact is worse than a red one"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  smoke:
    name: smoke-${{ matrix.os }}
    needs: [desktop]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: openclicky-desktop-macos
          - os: windows-latest
            artifact: openclicky-desktop-windows
          - os: ubuntu-latest
            artifact: openclicky-desktop-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Show what was downloaded
        shell: bash
        run: ls -la dist
      - name: Install and launch (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(ls dist/*.dmg | head -1)
          mkdir -p mnt
          hdiutil attach "$DMG" -nobrowse -quiet -mountpoint mnt
          APP=$(ls -d mnt/*.app | head -1)
          cp -R "$APP" /tmp/App.app
          hdiutil detach mnt -quiet
          xattr -dr com.apple.quarantine /tmp/App.app || true
          BIN=$(find /tmp/App.app/Contents/MacOS -type f -perm -111 | head -1)
          echo "binary=$BIN"
          "$BIN" & PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::the app exited within 10s of launch"
            exit 1
          fi
          kill "$PID" || true
          # A window count here needs the accessibility grant, which a runner
          # cannot give itself, so macOS stops at "the process survived".
          #
          # The version is the one claim this job can still check, and printing it
          # checked nothing: a bundle carrying the previous release would have read
          # as a pass. Compare it with what the crate says instead.
          in_bundle=$(defaults read /tmp/App.app/Contents/Info.plist CFBundleShortVersionString)
          expected=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "bundle $in_bundle, crate $expected"
          if [ "$in_bundle" != "$expected" ]; then
            echo "::error::the app reports $in_bundle but this tree builds $expected"
            exit 1
          fi
      - name: Install and launch (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*setup.exe | Select-Object -First 1
          Write-Host "installer=$($setup.FullName)"
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $roots = @("$env:LOCALAPPDATA", "$env:ProgramFiles")
          $exe = Get-ChildItem $roots -Recurse -Filter 'openclicky-desktop.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem $roots -Recurse -Filter '*.exe' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'OpenClicky' -and $_.Name -notmatch 'uninstall|setup' } |
              Select-Object -First 1
          }
          if (-not $exe) { Write-Error 'the installer produced no runnable exe'; exit 1 }
          Write-Host "binary=$($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { Write-Error "the app exited with $($p.ExitCode)"; exit 1 }
          $p.Refresh()
          if ([string]::IsNullOrWhiteSpace($p.MainWindowTitle)) {
            Write-Error 'the process survived but no window appeared'
            exit 1
          }
          Write-Host "window=$($p.MainWindowTitle)"
          Stop-Process -Id $p.Id -Force
      - name: Install and launch (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/linux-deps.sh smoke
          sudo apt-get install -y ./dist/*.deb
          BIN=$(command -v openclicky-desktop || true)
          if [ -z "$BIN" ]; then
            echo "::error::the deb installed no openclicky-desktop binary"
            exit 1
          fi
          echo "binary=$BIN"
          export WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1
          dbus-run-session -- xvfb-run -a --server-args="-screen 0 1280x800x24" bash -c '
            "$1" & PID=$!
            sleep 12
            if ! kill -0 "$PID" 2>/dev/null; then echo "::error::the app exited within 12s of launch"; exit 1; fi
            wins=$(xdotool search --onlyvisible --name . 2>/dev/null | wc -l)
            echo "visible windows: $wins"
            if [ "$wins" -eq 0 ]; then echo "::error::the process survived but no window appeared"; exit 1; fi
            kill "$PID" || true
          ' _ "$BIN"

  publish:
    needs: [build, desktop, smoke]
    # A manual dispatch has no tag to publish under, so it builds and stops. Only
    # a v* tag creates a Release; otherwise every dispatch would end red for a
    # reason that is not a defect.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: One checksum file for the whole release
        shell: bash
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%f\n' \
            | sort | while read -r f; do sha256sum "$f" >> SHA256SUMS; done
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
          test -s SHA256SUMS || {
            echo "::error::no artifacts to checksum"
            exit 1
          }
      - name: Publish with gh
        # softprops/action-gh-release races with its own asset metadata updates:
        # uploading in parallel produced "error updating release asset metadata
        # ... HttpError: Not Found" and then "Too many retries", leaving a draft
        # with 8 of 15 assets. It also took both generate_release_notes and
        # body_path, which write the same field. gh is one deterministic path and
        # one source for the notes.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.publish_tag || github.ref_name }}"
          # A draft is this workflow's own leftovers and may be rebuilt. A public
          # release may already have downloads behind it, so refuse instead of
          # deleting fifteen assets to publish the same version again.
          if gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null | grep -q true; then
            gh release delete "$tag" --yes --cleanup-tag=false
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag is already public. Refusing to overwrite. Cut a new version."
            exit 1
          fi
          # Only this version's section. The file carries every release back to
          # 2.0.0, so pointing at it wholesale made the page for one tag the whole
          # project history, and cutting it out by hand after each release was the
          # kind of step that gets forgotten.
          # The tag drives both routes: a pushed tag and a dispatch with
          # publish_tag. Read the same thing the publish condition reads, not a
          # third spelling of the version.
          version="${{ inputs.publish_tag || github.ref_name }}"
          version="${version#v}"
          awk -v want="## ${version}" 'index($0, want) == 1 { found = 1; print; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${version}. Nothing was published."
            exit 1
          fi
          gh release create "$tag" --draft --title "$tag" --notes-file notes.md artifacts/*
          gh release edit "$tag" --notes-file notes.md --draft=false
          gh release view "$tag" --json assets -q '"assets: \(.assets | length)"'
