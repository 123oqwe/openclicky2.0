[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "apps/cli", "apps/desktop"]

[workspace.package]
version = "2.0.3"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["OpenClicky contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
